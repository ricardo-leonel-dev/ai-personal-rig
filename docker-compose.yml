              capabilities: [gpu]

  # ===========================================================
  # AGENT 4: Qwen 2.5 1.5B — Backup & Validation (Lightweight)
  # GPU 4 | Port 11505 | ~1.0GB (quantized)
  # ===========================================================
  vllm-agent-4:
    image: vllm/vllm-openai:latest
    container_name: vllm-agent-4
    restart: always
    ports:
      - "11505:8000"
    ipc: host
    volumes:
      - vllm_agent_4_data:/root/.cache/huggingface
