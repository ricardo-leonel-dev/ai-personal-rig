# ============================================================
# AI MULTI-AGENT RIG — docker-compose.yml
# 6 x NVIDIA GeForce GTX 1660 Ti (6 GB each = 36 GB total)
# 6 Independent Agents (1 GPU each) — 4-bit Quantized Models
#
# AGENTS (All quantized to ~3.5-4GB for single GPU deployment)
#   11501 — Mistral 7B (GPU 0) — Reasoning & Analysis
#   11502 — DeepSeek 7B Coder (GPU 1) — File automation & code
#   11503 — Llama 3.1 8B (GPU 2) — Planning & general tasks
#   11504 — Qwen 2.5 7B (GPU 3) — Multilingual & translation
#   11505 — Mistral 7B (GPU 4) — Backup & validation agent
#   11506 — Phi 3.5 mini (GPU 5) — Lightweight/fast agent
#
# SERVICES
#   11507 — Ollama embeddings (CPU) — Vector search/memory
#   3000  — Open WebUI — Multi-agent control interface
#
# AGENT CAPABILITIES (all models):
#   ✓ Tool/function calling for automation
#   ✓ File manipulation, email processing, task execution
#   ✓ Parallel execution (6 agents working simultaneously)
#   ✓ Strong instruction following & reasoning
#
# SETUP
#   1. cp .env.example .env && edit .env (add HF_TOKEN)
#   2. docker compose down && docker compose up -d
#   3. docker logs vllm-agent-0 -f (monitor startup)
#   4. Test: curl http://localhost:11501/v1/models
#
# QUANTIZATION INFO
#   All models use 4-bit AWQ quantization (TheBloke versions)
#   Reduces 14GB models → 3.5GB, 16GB → 4GB
#   Minimal quality loss, fits easily in 5.1GB per GPU
# ============================================================

services:

  # ===========================================================
  # AGENT 0: Qwen 2.5 3B — Reasoning & Analysis
  # GPU 0 | Port 11501 | ~2.0GB (quantized)
  # ===========================================================
  vllm-agent-0:
    image: vllm/vllm-openai:latest
    container_name: vllm-agent-0
    restart: always
    ports:
      - "11501:8000"
    ipc: host
    volumes:
      - vllm_agent_0_data:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - CUDA_VISIBLE_DEVICES=0
      - NVML_VISIBLE_DEVICES=0
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    command: >
      Qwen/Qwen2.5-3B-Instruct-AWQ
      --tensor-parallel-size 1
      --max-model-len 4096
      --max-num-batched-tokens 2048
      --quantization awq
      --gpu-memory-utilization 0.85
      --dtype float16
      --enable-auto-tool-choice
      --tool-call-parser qwen3_xml
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]

  # ===========================================================
  # AGENT 1: Qwen 2.5 3B — File Automation & Code
  # GPU 1 | Port 11502 | ~2.0GB (quantized)
  # ===========================================================
  vllm-agent-1:
    image: vllm/vllm-openai:latest
    container_name: vllm-agent-1
    restart: always
    ports:
      - "11502:8000"
    ipc: host
    volumes:
      - vllm_agent_1_data:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - CUDA_VISIBLE_DEVICES=1
      - NVML_VISIBLE_DEVICES=1
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    command: >
      Qwen/Qwen2.5-3B-Instruct-AWQ
      --tensor-parallel-size 1
      --max-model-len 4096
      --max-num-batched-tokens 2048
      --quantization awq
      --gpu-memory-utilization 0.85
      --dtype float16
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]

  # ===========================================================
  # AGENT 2: Qwen 2.5 3B — Planning & General Tasks
  # GPU 2 | Port 11503 | ~2.0GB (quantized)
  # ===========================================================
  vllm-agent-2:
    image: vllm/vllm-openai:latest
    container_name: vllm-agent-2
    restart: always
    ports:
      - "11503:8000"
    ipc: host
    volumes:
      - vllm_agent_2_data:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - CUDA_VISIBLE_DEVICES=2
      - NVML_VISIBLE_DEVICES=2
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    command: >
      Qwen/Qwen2.5-3B-Instruct-AWQ
      --tensor-parallel-size 1
      --max-model-len 4096
      --max-num-batched-tokens 2048
      --quantization awq
      --gpu-memory-utilization 0.85
      --dtype float16
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
