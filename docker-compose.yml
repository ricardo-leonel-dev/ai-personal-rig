    command: >
      Qwen/Qwen2.5-1.5B-Instruct
      --tensor-parallel-size 1
      --max-model-len 4096
      --max-num-batched-tokens 2048
      --gpu-memory-utilization 0.90
      --dtype float16
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['4']
              capabilities: [gpu]

  # ===========================================================
  # AGENT 5: Qwen 2.5 1.5B — Fast Decisions (Lightweight)
  # GPU 5 | Port 11506 | ~1.0GB (quantized)
  # ===========================================================
  vllm-agent-5:
    image: vllm/vllm-openai:latest
    container_name: vllm-agent-5
    restart: always
    ports:
      - "11506:8000"
    ipc: host
    volumes:
      - vllm_agent_5_data:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - CUDA_VISIBLE_DEVICES=5
      - NVML_VISIBLE_DEVICES=5
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    command: >
      Qwen/Qwen2.5-1.5B-Instruct
      --tensor-parallel-size 1
      --max-model-len 4096
      --max-num-batched-tokens 2048
      --gpu-memory-utilization 0.90
      --dtype float16
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['5']
              capabilities: [gpu]

  # ===========================================================
  # SERVICE: Ollama — Embeddings for Agent Memory
  # CPU (no GPU) | Port 11507
  # ===========================================================
  ollama-embeddings:
    image: ollama/ollama:latest
    container_name: ollama-embeddings
    restart: always
    ports:
      - "11507:11434"
    environment:
      - CUDA_VISIBLE_DEVICES=-1
      - OLLAMA_NUM_PARALLEL=4
    volumes:
      - ollama_data:/root/.ollama

  # ===========================================================
  # SERVICE: Open WebUI — Multi-Agent Control Interface
  # Access: http://YOUR_SERVER_IP:3000
  # ===========================================================
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: always
    ports:
      - "3000:8080"
    environment:
      - OPENAI_API_BASE_URL=http://vllm-agent-0:8000/v1
      - OPENAI_API_KEY=not-needed
      - WEBUI_SECRET_KEY=${OPEN_WEBUI_SECRET}
    volumes:
      - open-webui_data:/app/backend/data
    depends_on:
      - vllm-agent-0

# ===========================================================
# VOLUMES — Persistent agent model storage
# ===========================================================
volumes:
  vllm_agent_0_data:    # Mistral 7B AWQ
  vllm_agent_1_data:    # DeepSeek 7B AWQ
  vllm_agent_2_data:    # Llama 3.1 8B AWQ
  vllm_agent_3_data:    # Qwen 2.5 7B AWQ
  vllm_agent_4_data:    # Mistral 7B AWQ (backup)
  vllm_agent_5_data:    # Phi 3.5 mini
  ollama_data:          # Embeddings cache
  open-webui_data:      # Agent chat history & config
