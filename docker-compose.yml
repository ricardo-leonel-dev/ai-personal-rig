              capabilities: [gpu]

  # ===========================================================
  # AGENT 3: Qwen 2.5 3B — Multilingual & Translation
  # GPU 3 | Port 11504 | ~2.0GB (quantized)
  # ===========================================================
  vllm-agent-3:
    image: vllm/vllm-openai:latest
    container_name: vllm-agent-3
    restart: always
    ports:
      - "11504:8000"
    ipc: host
    volumes:
      - vllm_agent_3_data:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - CUDA_VISIBLE_DEVICES=3
      - NVML_VISIBLE_DEVICES=3
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    command: >
      Qwen/Qwen2.5-3B-Instruct-AWQ
      --tensor-parallel-size 1
      --max-model-len 4096
      --max-num-batched-tokens 2048
